# Credential values never belong in this file. Each token/key is a credential
# name stored in the Agent Vault UI or CLI, not the actual secret value.
services:
  - name: openai
    host: api.openai.com
    auth:
      type: bearer
      token: OPENAI_API_KEY

  - name: anthropic
    host: api.anthropic.com
    auth:
      type: api-key
      key: ANTHROPIC_API_KEY
      header: x-api-key

  - name: github
    host: api.github.com
    auth:
      type: bearer
      token: GITHUB_TOKEN
